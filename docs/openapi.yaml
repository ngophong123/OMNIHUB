openapi: 3.0.3
info:
  title: OMNIHUB Restaurant Operations API
  version: 0.1.0
  description: |
    HTTP REST API for OMNIHUB (POS ordering, QR table ordering, offline-capable Kitchen Display System,
    recipe-based inventory ledger, multi-method payments, compensating refunds, cash shift reconciliation,
    and transactional Outbox dead-letter administration).

    ### Authentication vs Authorization
    - **Staff authentication (`sessionCookie`)**: HttpOnly, `SameSite=Strict` cookie named `session` issued by `POST /auth/login`.
      Sessions are scoped to one `(tenantId, storeId, userId)` and re-validated inside database transactions.
    - **Origin CSRF protection**: State-changing requests (`POST`, `PUT`, `DELETE`, `PATCH`) must send an exact `Origin` matching `WEB_ORIGIN`.
    - **Role-Based Access Control (RBAC)**: Every staff endpoint enforces explicit store-scoped permissions (`OWNER`, `MANAGER`, `CASHIER`, `KITCHEN`, `INVENTORY`).
      Vendor extensions `x-required-permission` and `x-allowed-roles` document the exact server-side authorization policy.
    - **Customer QR table authentication (`tableSessionBearer`)**: Opaque 64-hex bearer token returned once by `POST /public/qr/{token}/session` (4-hour TTL, bound to the table's active QR credential hash).
    - **Idempotency & concurrency**: Business mutations through `CommandBus` require a UUID v4 `Idempotency-Key` header.
      Replaying the same key with an identical payload returns the original `{ id, version }` response; reusing the key with a different payload returns `409 IDEMPOTENCY_KEY_REUSED`.
      Database mutations execute in `Serializable` PostgreSQL transactions with bounded retries on `P2034` / `40001` / `40P01`.
    - **Sanitized error envelope**: All JSON errors follow `{ code, correlationId }` without leaking internal SQL or stack traces.
servers:
  - url: http://127.0.0.1:4000
    description: Local development API server
tags:
  - name: Health & Observability
    description: Liveness, readiness, and Prometheus telemetry endpoints.
  - name: Authentication
    description: Staff cookie session lifecycle.
  - name: Orders
    description: Order intake, cancellation, and kitchen item state transitions.
  - name: Payments & Refunds
    description: Multi-method payments, bill splits, compensating refunds, and daily net financial reports.
  - name: Cash Shifts
    description: Cash registers, cashier shift lifecycle, discrepancy approval, and cash drawer movements.
  - name: Kitchen
    description: Kitchen display device registration, offline command sync, and device administration.
  - name: QR Ordering
    description: Public guest QR menu, table sessions, order tracking, and store table administration.
  - name: Catalog
    description: Staff catalog projection and versioned CRUD for categories, stations, ingredients, products, variants, and modifiers.
  - name: Inventory
    description: Ingredient stock balances, stock receipts, manual adjustments, and immutable ledger queries.
  - name: Outbox
    description: Tenant-scoped Outbox Dead Letter Queue inspection and safe replay.
  - name: Administration
    description: Store pilot readiness and single-use staff invitations.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly SameSite=Strict staff session cookie issued by POST /auth/login.
    tableSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: 64-char hex token
      description: Customer table session bearer token issued by POST /public/qr/{token}/session.
    metricsBearer:
      type: http
      scheme: bearer
      description: Optional bearer token matching METRICS_AUTH_TOKEN; loopback-only when unset.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID v4 idempotency key persisted in CommandReceipt.
      schema:
        type: string
        format: uuid
    KitchenDeviceHeader:
      name: X-Kitchen-Device
      in: header
      required: false
      description: Registered non-secret KitchenDevice UUID. Required for KITCHEN role on order reads, item commands, and /kitchen/sync.
      schema:
        type: string
        format: uuid
    KitchenDeviceHeaderRequired:
      name: X-Kitchen-Device
      in: header
      required: true
      description: Registered KitchenDevice UUID matching every command's deviceId in the sync batch.
      schema:
        type: string
        format: uuid
    QrTokenHeader:
      name: X-QR-Token
      in: header
      required: false
      description: Raw 64-character hex table QR token (preferred over legacy query parameter ?token=).
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    EntityIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Hex64TokenPath:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'

  schemas:
    Role:
      type: string
      enum: [OWNER, MANAGER, CASHIER, KITCHEN, INVENTORY]
    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Sanitized machine-readable error code.
          example: INVALID_INPUT
        correlationId:
          type: string
          description: Request correlation identifier echoed from X-Correlation-ID or server-generated.
    CommandResult:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
    VersionBody:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, storeId]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        storeId:
          type: string
          format: uuid
    OrderLineInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        variantId:
          type: string
          format: uuid
        modifierIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 250
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLineInput'
    OrderCancelRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 300
    ItemCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, action]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        action:
          type: string
          enum: [START, READY, HANDOFF, CANCEL]
    LegacyCashPaymentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, tendered]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        tendered:
          type: integer
          minimum: 0
          maximum: 1000000000
    RecordPaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
        method:
          type: string
          enum: [CASH, BANK_TRANSFER, CARD]
        tendered:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Required for CASH payments and must be >= amount.
        externalReference:
          type: string
          minLength: 3
          maxLength: 120
          description: Required for BANK_TRANSFER payments; unique per (tenantId, storeId, method).
        splitId:
          type: string
          format: uuid
    BillSplitRequest:
      type: object
      additionalProperties: false
      required: [label]
      description: Must provide exactly one of amount or itemIds (XOR).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
        itemIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    PaymentFailureRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 300
    RefundRequest:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
        reason:
          type: string
          minLength: 5
          maxLength: 300
        itemId:
          type: string
          format: uuid
          description: Optional order item scope; refund cannot exceed item unitPrice.
    RefundDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
          minLength: 5
          maxLength: 300
        shiftId:
          type: string
          format: uuid
          description: |
            Optional OPEN CashShift UUID for APPROVED CASH refunds. When omitted, only the approving manager's
            own OPEN shift is used; another cashier's shift is never silently selected.
    CashRegisterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    CashShiftOpenRequest:
      type: object
      additionalProperties: false
      required: [registerId, openingAmount]
      properties:
        registerId:
          type: string
          format: uuid
        cashierId:
          type: string
          format: uuid
          description: Optional cashier assignment; specifying another user requires OWNER or MANAGER role.
        openingAmount:
          type: integer
          minimum: 0
          maximum: 1000000000
    CashShiftCloseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, countedAmount]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        countedAmount:
          type: integer
          minimum: 0
          maximum: 1000000000
        reason:
          type: string
          maxLength: 300
          description: Required (min 5 trimmed chars) whenever countedAmount differs from expectedAmount.
    CashShiftApproveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 5
          maxLength: 300
    CashMovementRequest:
      type: object
      additionalProperties: false
      required: [shiftId, kind, amount, reason]
      properties:
        shiftId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CASH_IN, CASH_OUT, REFUND, CORRECTION_IN, CORRECTION_OUT]
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
        reason:
          type: string
          minLength: 5
          maxLength: 300
        paymentId:
          type: string
          format: uuid
          description: Required iff kind is REFUND. Recording kind=REFUND requires cashApprove (OWNER/MANAGER).
    KitchenDeviceRegisterRequest:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
          format: uuid
    KitchenDeviceAssignmentRequest:
      type: object
      additionalProperties: false
      required: [stationId]
      properties:
        stationId:
          type: string
          format: uuid
          nullable: true
    KitchenReplayCommand:
      type: object
      additionalProperties: false
      required: [commandId, tenantId, storeId, userId, deviceId, sequence, orderId, itemId, expectedVersion, action, createdAt]
      properties:
        commandId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        orderId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [START, READY]
        createdAt:
          type: string
          format: date-time
    KitchenSyncRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/KitchenReplayCommand'
    StockAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [ingredientId, delta, reason]
      properties:
        ingredientId:
          type: string
          format: uuid
        delta:
          type: string
          pattern: '^-?\d+(\.\d{1,3})?$'
        reason:
          type: string
          minLength: 5
          maxLength: 300
    RecipeLineInput:
      type: object
      additionalProperties: false
      required: [ingredientId, quantity, unit]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,3})?$'
        unit:
          type: string
          enum: [g, kg, ml, l, piece]
    StockReceiptRequest:
      type: object
      additionalProperties: false
      required: [reference, supplier, lines]
      properties:
        reference:
          type: string
          minLength: 3
          maxLength: 80
        supplier:
          type: string
          minLength: 1
          maxLength: 120
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeLineInput'
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, active, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
    StationCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
    StationUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, active, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
    IngredientCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active, unit, lowStockThreshold]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        unit:
          type: string
          enum: [g, ml, piece]
        lowStockThreshold:
          type: string
          pattern: '^\d+(\.\d{1,3})?$'
    IngredientUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/IngredientCreateRequest'
        - $ref: '#/components/schemas/VersionBody'
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active, description, price, stationId, categoryId, manualAvailable, recipe]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        description:
          type: string
          maxLength: 1000
        imageUrl:
          type: string
          format: uri
          maxLength: 1000
          nullable: true
          description: Must use https:// protocol when provided.
        price:
          type: integer
          minimum: 0
          maximum: 1000000000
        stationId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        manualAvailable:
          type: boolean
        recipe:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeLineInput'
    ProductUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductCreateRequest'
        - $ref: '#/components/schemas/VersionBody'
    ProductAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, available]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        available:
          type: boolean
    VariantCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active, price, recipeMultiplier]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        price:
          type: integer
          minimum: 0
          maximum: 1000000000
        recipeMultiplier:
          type: string
          pattern: '^\d+(\.\d{1,3})?$'
          description: Numeric multiplier > 0 and <= 1000.
    VariantUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/VariantCreateRequest'
        - $ref: '#/components/schemas/VersionBody'
    ModifierGroupCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active, minSelections, maxSelections]
      description: Enforces minSelections <= maxSelections.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        minSelections:
          type: integer
          minimum: 0
          maximum: 20
        maxSelections:
          type: integer
          minimum: 1
          maximum: 20
    ModifierGroupUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ModifierGroupCreateRequest'
        - $ref: '#/components/schemas/VersionBody'
    ModifierCreateRequest:
      type: object
      additionalProperties: false
      required: [name, active, priceDelta, recipe]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        priceDelta:
          type: integer
          minimum: 0
          maximum: 1000000000
        recipe:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeLineInput'
    ModifierUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ModifierCreateRequest'
        - $ref: '#/components/schemas/VersionBody'
    TableConfigRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    TableCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    TableUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, active, qrEnabled, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        active:
          type: boolean
        qrEnabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
    InvitationCreateRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum: [MANAGER, CASHIER, KITCHEN, INVENTORY]
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
    OutboxReplayRequest:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    OutboxDeadLetterRow:
      type: object
      required: [id, tenantId, storeId, type, aggregateId, version, attempts, maxAttempts, createdAt, deadLetteredAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        type:
          type: string
        aggregateId:
          type: string
          format: uuid
        version:
          type: integer
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        deadLetteredAt:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Validation error, invalid UUID/JSON body, or invalid input reference.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid staff session cookie or credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role/permission, Origin header mismatch, or unauthorized kitchen device/table session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist within the authenticated tenant and store scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business rule conflict, stale optimistic version, idempotency key reuse, insufficient stock, or concurrency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Shared Redis rate limit exceeded or per-account lockout active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected internal server failure (details redacted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: PostgreSQL or Redis dependency unavailable (fail-closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      tags: [Health & Observability]
      operationId: getHealth
      summary: Liveness probe
      description: Public process liveness endpoint.
      security: []
      responses:
        '200':
          description: API process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [Health & Observability]
      operationId: getReadiness
      summary: Readiness probe
      description: Verifies PostgreSQL connectivity, protected rate-limit Redis PING, and realtime Redis adapter/subscriber readiness.
      security: []
      responses:
        '200':
          description: All dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                required: [database, redis, realtime]
                properties:
                  database:
                    type: string
                    example: ok
                  redis:
                    type: string
                    example: ok
                  realtime:
                    type: string
                    example: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /metrics:
    get:
      tags: [Health & Observability]
      operationId: getMetrics
      summary: Prometheus metrics scrape endpoint
      description: Exposes Prometheus telemetry. Requires METRICS_AUTH_TOKEN bearer authentication when configured, or loopback client access otherwise, with bounded LRU rate limiting.
      security:
        - metricsBearer: []
      responses:
        '200':
          description: Prometheus text exposition metrics.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginStaff
      summary: Authenticate staff member and issue session cookie
      description: Validates credentials with async scrypt and issues an HttpOnly SameSite=Strict session cookie. Protected by IP and per-account Redis Lua rate limits (fail-closed 503 if Redis is unavailable).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Session created and set via Set-Cookie header.
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt]
                properties:
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Inspect current authenticated staff session
      security:
        - sessionCookie: []
      x-required-permission: read
      x-allowed-roles: [OWNER, MANAGER, CASHIER, KITCHEN, INVENTORY]
      responses:
        '200':
          description: Active user, tenant, store, and role details.
          content:
            application/json:
              schema:
                type: object
                required: [userId, tenantId, storeId, role, storeName]
