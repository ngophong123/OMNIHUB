                  checks:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/invitations:
    get:
      tags: [Administration]
      operationId: listStoreInvitations
      summary: List latest 100 store staff invitations
      security:
        - sessionCookie: []
      x-required-permission: admin
      x-allowed-roles: [OWNER, MANAGER]
      responses:
        '200':
          description: Store invitations with computed status (PENDING, ACCEPTED, REVOKED, EXPIRED).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Administration]
      operationId: createStoreInvitation
      summary: Issue a single-use 24-hour staff invitation
      description: MANAGER cannot invite another MANAGER (403 INVITATION_ROLE_NOT_ALLOWED). Raw invitation token is returned once.
      security:
        - sessionCookie: []
      x-required-permission: admin
      x-allowed-roles: [OWNER, MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '201':
          description: Invitation created with one-time token.
          content:
            application/json:
              schema:
                type: object
                required: [id, email, role, expiresAt, token]
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  role:
                    $ref: '#/components/schemas/Role'
                  expiresAt:
                    type: string
                    format: date-time
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/invitations/{id}/revoke:
    post:
      tags: [Administration]
      operationId: revokeStoreInvitation
      summary: Revoke a pending store invitation
      description: MANAGER cannot revoke a MANAGER invitation (403 INVITATION_ROLE_NOT_ALLOWED).
      security:
        - sessionCookie: []
      x-required-permission: admin
      x-allowed-roles: [OWNER, MANAGER]
      parameters:
        - $ref: '#/components/parameters/EntityIdPath'
      responses:
        '201':
          description: Invitation revoked.
          content:
            application/json:
              schema:
                type: object
                required: [id, revoked]
                properties:
                  id:
                    type: string
                    format: uuid
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /public/invitations/{token}/accept:
    post:
      tags: [Administration]
      operationId: acceptStoreInvitation
      summary: Accept a single-use staff invitation
      description: Public endpoint protected by dedicated 10 req/min Redis rate limiting. Existing accounts must be active and verify their password; invalid/expired tokens, inactive accounts, and password mismatches all return unified 401 INVITATION_INVALID_OR_EXPIRED to prevent cross-tenant email enumeration.
      security: []
      parameters:
        - $ref: '#/components/parameters/Hex64TokenPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '201':
          description: Invitation accepted and store membership created.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, email, storeId]
                properties:
                  accepted:
                    type: boolean
                  email:
                    type: string
                    format: email
                  storeId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
