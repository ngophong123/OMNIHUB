name: omnihub-staging
x-app: &app
  image: omnihub-staging-api:local
  build: { context: .., dockerfile: deploy/Dockerfile, target: api }
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:uid=1000,gid=1000,mode=1770"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35s
  networks: [private]
  secrets: [db_app_password, redis_password, qr_secret]
  environment: &app-env
    NODE_ENV: production
    WEB_ORIGIN: https://localhost:8443
    SESSION_SECURE: "true"
    TRUSTED_PROXY_CIDRS: 172.29.87.250
    DATA_NETWORK_MODE: isolated-single-host
    API_HOST: 0.0.0.0
    PORT: "4000"
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnihub_staging
      POSTGRES_USER: staging_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_admin_password, db_owner_password, db_app_password, db_backup_password]
    volumes:
      - staging_pg:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U staging_admin -d omnihub_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [sh, /etc/omnihub/redis-start.sh]
    secrets: [redis_password]
    volumes:
      - staging_redis:/data
      - ./redis-start.sh:/etc/omnihub/redis-start.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user app ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    secrets: [db_owner_password, redis_password, qr_secret]
    environment:
      <<: *app-env
      DB_ROLE: omnihub_owner
      DB_PASSWORD_SECRET: db_owner_password
    command: [node, --require, /app/deploy/load-secrets.cjs, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    <<: *app
    profiles: [tools]
    restart: "no"
    secrets: [db_app_password, redis_password, qr_secret, demo_password]
    environment:
      <<: *app-env
      SEED_DEMO: "true"
    command: [node, --require, /app/deploy/load-secrets.cjs, --import, tsx, prisma/seed.ts]
  api:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    environment:
      <<: *app-env
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    command: [node, --require, /app/deploy/load-secrets.cjs, apps/api/dist/worker.js]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/worker-heartbeat','utf8'))<15000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 3
  web:
    image: omnihub-staging-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args: { NEXT_PUBLIC_API_URL: "https://localhost:8444" }
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1770"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:8444:8444", "127.0.0.1:8080:8080"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy:/data
      - staging_caddy_config:/config
    networks:
      private: { ipv4_address: 172.29.87.250 }
      edge: {}
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
  backup:
    image: omnihub-staging-backup:local
    build: { context: .., dockerfile: deploy/backup/Dockerfile }
    profiles: [backup]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    secrets: [db_backup_password, backup_password]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omnihub_backup
      PGDATABASE: omnihub_staging
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/backup_password
      RESTIC_CACHE_DIR: /tmp/restic-cache
      BACKUP_INTERVAL_SECONDS: "300"
      BACKUP_MAX_AGE_SECONDS: "900"
      BACKUP_MONITOR_INTERVAL_SECONDS: "30"
    volumes: ["staging_backup:/repository", "staging_backup_state:/state"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, /usr/local/bin/omnihub-backup, health]
      interval: 60s
      timeout: 5s
      retries: 2
  backup-monitor:
    image: omnihub-staging-backup:local
    profiles: [backup]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:mode=1700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [monitor]
    environment:
      BACKUP_INTERVAL_SECONDS: "300"
      BACKUP_MAX_AGE_SECONDS: "900"
      BACKUP_MONITOR_INTERVAL_SECONDS: "30"
    volumes: ["staging_backup_state:/state"]
    depends_on:
      backup: { condition: service_started }
networks:
  edge: {}
  private:
    internal: true
    ipam: { config: [{ subnet: 172.29.87.0/24 }] }
volumes:
  staging_pg:
  staging_redis:
  staging_caddy:
  staging_caddy_config:
  staging_backup:
  staging_backup_state:
secrets:
  db_admin_password: { file: ../.local/staging/secrets/db_admin_password }
  db_owner_password: { file: ../.local/staging/secrets/db_owner_password }
  db_app_password: { file: ../.local/staging/secrets/db_app_password }
  db_backup_password: { file: ../.local/staging/secrets/db_backup_password }
  redis_password: { file: ../.local/staging/secrets/redis_password }
  qr_secret: { file: ../.local/staging/secrets/qr_secret }
  demo_password: { file: ../.local/staging/secrets/demo_password }
  backup_password: { file: ../.local/staging/secrets/backup_password }
